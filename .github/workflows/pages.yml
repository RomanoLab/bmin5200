# Build the course site and publish it to GitHub Pages at bmin5200.jdr.bio.
#
# apply_links.py resolves the LINK:: placeholders from links.tsv into build/,
# so build/ is generated here and never committed. To change a link: edit
# links.tsv, push, done.
#
# Once links.tsv is complete, add --strict to the build step below. An
# unfilled placeholder then fails the build instead of shipping a dead link.
name: Deploy course site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve links into build/
        run: python3 tools/apply_links.py

      - name: Check the publish tree
        run: |
          test -f build/new-course-site/index.html
          test -f build/new-course-site/CNAME
          echo "CNAME contains: $(cat build/new-course-site/CNAME)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/new-course-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
